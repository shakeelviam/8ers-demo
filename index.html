<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui;background:#faf9f5}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>8ers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap">
<style>
/* Layout: a 390×844 phone frame centred on desktop; full-bleed on phones. Screens render inside .view, nav pinned inside the frame. */
:root{
  --red:#D6202B; --red-d:#B3161F; --red-t:#FCE9EA;
  --navy:#16214A; --ink:#1C2541; --muted:#5B6478; --line:#E4E7EF; --soft:#EEF1F7;
  --bg:#F4F5F9; --card:#FFFFFF; --canvas:#0E1428;
  --gold:#B8860B; --gold-l:#F1D27A; --gold-t:#FBF3DD; --silver:#7F8794; --silver-l:#DDE1E8; --green:#1F8A4C; --green-t:#E6F4EC;
  --shadow:0 1px 2px rgba(22,33,74,.06),0 8px 24px rgba(22,33,74,.08);
  --display:'Lora',Georgia,serif; --ui:'Manrope',system-ui,sans-serif; --ar:'IBM Plex Sans Arabic','Manrope',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:var(--red)}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding-block:24px}
.aside{color:#AAB3CC;max-width:280px;font-size:14px;line-height:1.5}
.aside h1{font-family:var(--display);color:#fff;font-size:28px;margin:0 0 8px}
.aside p{margin:0 0 12px}
.aside .kbd{display:inline-block;border:1px solid #33406A;border-radius:6px;padding:1px 7px;font-size:12px;color:#DCE2F5}
.phone{width:390px;height:844px;max-width:100%;background:var(--bg);border-radius:44px;box-shadow:0 0 0 12px #1B2340,0 0 0 14px #2B3562,0 40px 80px rgba(0,0,0,.6);position:relative;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#1B2340;border-radius:0 0 20px 20px;z-index:20}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding-top:34px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.view.nonav{padding-bottom:20px}
.view.hasnav{padding-bottom:96px}
.screen{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
@media (max-width:820px){.aside{display:none}}
@media (max-width:480px){
  body{padding-inline:0;background:var(--bg)}
  .stage{padding-block:0;min-height:100%}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none;position:fixed;inset:0}
  .notch{display:none}
  .view{padding-top:env(safe-area-inset-top,0px)}
}
/* ---- atoms ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.iconbtn{width:44px;height:44px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.iconbtn .dot{position:absolute;top:9px;inset-inline-end:10px;width:8px;height:8px;border-radius:999px;background:var(--red);border:2px solid #fff}
.logo{height:44px;width:auto}
.leaguestrip{display:flex;align-items:center;justify-content:center;gap:8px;padding-top:8px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.h1{font-family:var(--display);font-weight:700;color:var(--navy);line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.center{text-align:center}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.btn{width:100%;height:52px;border-radius:14px;border:none;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;color:#fff;background:var(--red);transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.navy{background:var(--navy)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.outline{background:var(--card);color:var(--red);border:1.5px solid var(--red)}
.btn.sm{height:44px;font-size:14px;width:auto;padding:0 16px}
.btn[disabled]{background:var(--soft);color:#9AA3B2;cursor:not-allowed}
.btn:focus-visible,.iconbtn:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:3px solid #7CA1FF;outline-offset:2px}
.sect{display:flex;align-items:flex-end;justify-content:space-between}
.sect .t{display:flex;gap:10px}
.sect .bar{width:4px;border-radius:2px;background:var(--red)}
.sect .name{font-family:var(--display);font-weight:700;font-size:20px;color:var(--navy)}
.sect .sub{margin-top:2px;font-size:13px}
.link{font-size:13px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:2px;background:none;border:none;padding:0;min-height:44px;margin-block:-13px}
.badge{border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.5px;flex-shrink:0}
.crest{border-radius:999px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;border:2px solid rgba(255,255,255,.9);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.avatar{border-radius:999px;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.avatar.me{background:var(--red-t);color:var(--red)}
.avatar.empty{background:transparent;border:1.5px dashed #C4CAD6}
.ball{border-radius:999px;flex-shrink:0;box-shadow:0 4px 10px rgba(22,33,74,.18),inset 0 -3px 6px rgba(0,0,0,.15)}
.ball.gold{background:radial-gradient(circle at 35% 30%,#FFF2BF 0%,#E9C45C 35%,#B8860B 75%,#7A5A08 100%)}
.ball.silver{background:radial-gradient(circle at 35% 30%,#FFFFFF 0%,#DDE1E8 35%,#9AA3B2 75%,#5F6875 100%)}
.pill{height:36px;padding:0 14px;border-radius:999px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
.tag{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.tag.red{background:var(--red-t);color:var(--red)}
.tag.gold{background:var(--gold-t);color:var(--gold)}
.tag.grey{background:var(--soft);color:var(--muted)}
.tag.green{background:var(--green-t);color:var(--green)}
.note{background:var(--red-t);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--red)}
.note.grey{background:var(--soft);color:var(--muted)}
.divider{height:1px;background:var(--line)}
.lbl{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
[dir=rtl] .flip{transform:scaleX(-1)}
[dir=rtl] .phone{font-family:var(--ar)}
[dir=rtl] .h1,[dir=rtl] .sect .name{font-family:var(--ar)}
/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 8px calc(14px + env(safe-area-inset-bottom,0px));z-index:10}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;color:var(--muted);background:none;border:none;font-size:11px;font-weight:700}
.nav button.on{color:var(--red);font-weight:800}
.nav button .ul{width:22px;height:3px;border-radius:2px;margin-top:2px;background:transparent}
.nav button.on .ul{background:var(--red)}
/* league cards */
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lcard{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px 16px 16px;border-radius:20px;border:2px solid transparent;background:var(--card);box-shadow:var(--shadow);text-align:start;color:var(--ink)}
.lcard.on{border-color:var(--red)}
.lcard .name{font-family:var(--display);font-weight:700;font-size:19px;color:var(--navy)}
.lcard .sport{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.lcard .go{position:absolute;inset-inline-end:14px;bottom:14px;width:32px;height:32px;border-radius:999px;background:var(--red);display:flex;align-items:center;justify-content:center}
.lcard .chk{position:absolute;top:12px;inset-inline-end:12px;width:26px;height:26px;border-radius:999px;background:var(--red);display:flex;align-items:center;justify-content:center}
.lcard.soon{border:2px dashed #C4CAD6;box-shadow:none;background:transparent;align-items:center;justify-content:center;color:var(--muted);font-weight:800;font-size:13px;text-align:center;min-height:150px}
/* news */
.news{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.news .img{height:150px;display:flex;align-items:flex-end;padding:12px;position:relative}
.news .img .ph{font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.35);padding:4px 8px;border-radius:6px}
.news .body{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.news .title{font-family:var(--display);font-weight:700;font-size:17px;color:var(--navy);line-height:1.25}
.news .ago{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots span{width:6px;height:6px;border-radius:3px;background:#C4CAD6}
.dots span.on{width:16px;background:var(--red)}
/* tabs row */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:78px;padding:12px 6px;border-radius:14px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:none;font-size:12px;font-weight:800;flex-shrink:0}
.tab.on{background:var(--red);color:#fff}
/* comps */
.comps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.comp{background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;border:none;text-align:start;color:var(--ink)}
.comp .ic{width:48px;height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.comp .n{font-family:var(--display);font-weight:700;font-size:16px;color:var(--navy)}
.comp .s{font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
/* match rows */
.mrow{display:grid;grid-template-columns:38px 1fr 22px 1fr 16px;align-items:center;gap:6px;padding:12px 2px;border-bottom:1px solid var(--line);color:var(--ink)}
.mrow:last-child{border-bottom:none}
.mrow .when{font-size:11px;font-weight:700;color:var(--muted);line-height:1.25}
.mrow .team{display:flex;align-items:center;gap:7px;min-width:0;font-weight:800;font-size:13px;line-height:1.15;letter-spacing:-.2px}
.mrow .vs{font-size:10px;font-weight:800;color:var(--muted);text-align:center}
/* size picker */
.sizes{display:flex;gap:12px}
.tile{position:relative;flex:1;height:118px;border-radius:18px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink)}
.tile.on{border-color:var(--red)}
.tile .chk{position:absolute;top:10px;inset-inline-end:10px;width:24px;height:24px;border-radius:999px;background:var(--red);display:flex;align-items:center;justify-content:center}
.tile .n{font-weight:800;font-size:16px}
.tile .s{font-size:11px;font-weight:700;color:var(--muted);margin-top:-6px}
.seats{display:flex;gap:6px;flex-wrap:wrap}
/* inputs */
.input{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-weight:700;font-size:16px;color:var(--ink);width:100%}
.input:focus{outline:none;border-color:var(--navy)}
.codebox{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px}
.codebox .k{font-size:11px;font-weight:700;opacity:.75}
.codebox .v{font-size:22px;font-weight:800;letter-spacing:2px}
.share{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.share button{height:46px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13px;color:var(--ink);box-shadow:var(--shadow)}
/* bracket */
.bwrap{position:relative;width:326px;margin:0 auto}
.bnode{position:absolute;width:102px;height:40px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);display:flex;align-items:center;gap:7px;padding:0 9px;font-weight:700;font-size:13px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden}
.bnode.win{background:var(--red-t);border-color:var(--red);font-weight:800}
.bnode.me{background:var(--red);border-color:var(--red);color:#fff;font-weight:800}
.bnode.out{opacity:.55}
.bnode.empty{border-style:dashed;border-color:#C4CAD6;color:var(--muted)}
.bnode .av{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background:var(--soft);color:var(--muted)}
.bnode.win .av{background:var(--red-t);color:var(--red)}
.bnode.me .av{background:#fff;color:var(--red)}
.bline{position:absolute;background:#C4CAD6;border-radius:1px}
.bhead{position:absolute;top:0;width:102px;text-align:center;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.8px}
[dir=rtl] .bwrap{direction:ltr}
/* predictions */
.opts{display:flex;gap:8px}
.opt{flex:1;min-width:0;height:46px;border-radius:12px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;white-space:nowrap}
.opt.on{background:var(--red);color:#fff;border-color:var(--red)}
.opt .ck{width:18px;height:18px;border-radius:999px;background:#fff;display:none;align-items:center;justify-content:center;flex-shrink:0}
.opt.on .ck{display:flex}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--card);height:46px;overflow:hidden}
.stepper button{width:44px;height:100%;border:none;background:transparent;display:flex;align-items:center;justify-content:center}
.stepper .v{flex:1;text-align:center;font-weight:800;font-size:17px}
.q{display:flex;flex-direction:column;gap:8px}
.q .qh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.q .qn{width:22px;height:22px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.progress{display:flex;gap:3px;flex:1}
.progress span{flex:1;height:6px;border-radius:3px;background:#D9DDE6}
.progress span.on{background:var(--red)}
.matchcard{display:flex;align-items:center;justify-content:space-between;gap:8px}
.matchcard .side{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;font-weight:800;font-size:14px;text-align:center;line-height:1.15}
.matchcard .mid{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.matchcard .mid .vs{font-family:var(--display);font-weight:700;font-size:22px;color:var(--red)}
.mnav{display:flex;gap:8px;justify-content:center;margin-top:10px}
.mnav button{width:40px;height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:11px;font-weight:800;color:var(--muted);padding:0}
.mnav button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mnav button.done{border-color:var(--green);color:var(--green)}
.mnav button.done.on{background:var(--green);color:#fff}
/* results */
.scorehead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.scorehead .p{display:flex;flex-direction:column;align-items:center;gap:8px}
.scorehead .big{font-size:44px;font-weight:800;line-height:1}
.brow{display:grid;grid-template-columns:1fr 76px 76px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.brow:last-child{border-bottom:none}
.brow .a{text-align:center;font-weight:800;color:var(--red);background:var(--red-t);border-radius:8px;padding:6px 0;margin-inline-end:6px;font-size:15px}
.brow .b{text-align:center;font-weight:800;color:var(--ink);font-size:15px}
.brow.tot{font-size:16px;color:var(--ink);font-weight:800}
.brow.tot .a,.brow.tot .b{font-size:20px}
.brow.q{padding:7px 0;border-bottom:none;font-size:12px}
.brow.q .a,.brow.q .b{background:none;padding:0;font-size:12px;display:flex;justify-content:center;align-items:center;gap:4px}
.ok{color:var(--green)}.no{color:var(--red)}
/* rankings */
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;border:1px solid var(--line)}
.seg button{flex:1;height:44px;border-radius:999px;border:none;background:transparent;color:var(--ink);font-weight:800;font-size:14px}
.seg button.on{background:var(--red);color:#fff}
.podium{display:flex;gap:8px;align-items:flex-end;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px 0;box-shadow:var(--shadow)}
.podium .p{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.podium .p .name{font-weight:800;font-size:14px}
.podium .p .pts{font-size:12px;font-weight:700;color:var(--muted)}
.podium .p .base{width:100%;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:6px}
.podium .p .pos{font-family:var(--display);font-weight:700;font-size:22px}
.rtable{background:var(--card);border-radius:0 0 20px 20px;padding:4px 12px 8px;box-shadow:var(--shadow)}
.rrow{display:grid;grid-template-columns:28px 36px 1fr auto auto;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:none}
.rrow.me{background:var(--red-t);border-radius:12px;padding:10px 12px;border-bottom:none}
.rrow .pos{font-weight:800;font-size:15px;color:var(--muted)}
.rrow.me .pos,.rrow.me .pts{color:var(--red)}
.rrow .name{font-weight:800;font-size:15px}
.rrow .balls{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.rrow .balls span{display:flex;align-items:center;gap:4px}
.rrow .pts{font-weight:800;font-size:15px;min-width:36px;text-align:end}
/* profile */
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat .k{font-size:12px;font-weight:700;color:var(--muted)}
.stat .v{font-size:22px;font-weight:800;color:var(--navy);line-height:1.1}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ach{background:var(--card);border-radius:14px;padding:12px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;font-weight:800;text-align:center}
.ach .ic{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.ach.locked{opacity:.45}
/* overlays */
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:in .2s ease-out}
.sheetbg{position:absolute;inset:0;background:rgba(14,20,40,.55);z-index:25;display:flex;align-items:flex-end}

/* fixtures for a round: 5 matches from the league's teams, seeded */
function fixtures(){ const L = lg(); const r = rng(S.seed*31 + S.round*7 + L.id.length); const idx = [...L.teams.keys()]; for (let i = idx.length-1; i>0; i--){ const j = Math.floor(r()*(i+1)); [idx[i],idx[j]] = [idx[j],idx[i]]; } const out=[]; for (let i=0;i<5;i++) out.push({ a:L.teams[idx[2*i]], b:L.teams[idx[2*i+1]], day:["Sat","Sat","Sun","Sun","Mon"][i], time:["17:00","20:00","16:30","19:00","21:00"][i] }); return out; }

function userMatch(){ const b = S.bracket; if (!b) return null; const rd = b.rounds[S.round]; return rd.find(m => m.a==="Mubarak" || m.b==="Mubarak") || null; }
function opponent(){ const m = userMatch(); if (!m) return null; return m.a==="Mubarak" ? m.b : m.a; }

function simulate(){

  fx.forEach((m,i) => {

    // result: user's main pick is right 65% of the time in the demo; opponent random pick
    const mainOpts = MAIN[L.sport].length; const actualMain = r()<0.65 ? p.main : Math.floor(r()*mainOpts);
    const oppMain = Math.floor(r()*mainOpts);
    let myPts = actualMain===p.main ? PTS.main : 0, opPts = actualMain===oppMain ? PTS.main : 0;
    const detail=[];
    qs.forEach(q => {

      const keys = q.opts.map(optKey); const actual = r()<0.6 ? p.q[q.id] : keys[Math.floor(r()*keys.length)]; const oppPick = keys[Math.floor(r()*keys.length)];
      const mine = actual===p.q[q.id], theirs = actual===oppPick; myPts += mine?PTS.extra:0; opPts += theirs?PTS.extra:0; detail.push({ q, mine, theirs, v:PTS.extra });
    });

    let sa, sb; if (L.sport==="football"){ sa=Math.floor(r()*3); sb=Math.floor(r()*3); if (actualMain===0 && sa<=sb) sa=sb+1; if (actualMain===1) sb=sa; if (actualMain===2 && sb<=sa) sb=sa+1; }
    else { const base = L.sport==="nfl"?17:104; sa = base+Math.floor(r()*17); sb = base+Math.floor(r()*17); if (actualMain===0 && sa<=sb) sa=sb+3; if (actualMain===1 && sb<=sa) sb=sa+3; }

  const rrow = (pos,x,me) => `<div class="rrow ${me?"me":""}"><span class="pos num">${pos}</span>${avatar(x[0],36,me)}<span class="name">${pname(x[0])}</span><span class="balls"><span>${ball("gold",16)}${x[2]}</span><span>${ball("silver",16)}${x[3]}</span></span><span class="pts num">${x[1]}</span></div>`;
  return topbar("menu","bell",false) + `<div class="pad center" style="padding-top:14px"><div class="h1" style="font-size:30px">${t("rankH")}</div><div class="row" style="justify-content:center;gap:8px;margin-top:6px">${badge(L,22)}<span style="color:var(--muted);font-weight:700;font-size:14px">${S.lang==="ar"?L.nameAr:L.name}</span><button class="link" data-act="go" data-arg="league">${t("change")}</button></div></div>
  <div class="pad" style="padding-top:16px"><div class="seg"><button data-act="segno">${t("weekly")}</button><button data-act="segno">${t("monthly")}</button><button class="on">${t("season")}</button></div></div>
  <div class="pad" style="padding-top:18px"><div class="podium">${pod(2,top[1],64,"var(--silver-l)","var(--silver)")}${pod(1,top[0],88,"var(--gold-t)","var(--gold)")}${pod(3,top[2],52,"#F3E4D8","#A0623A")}</div>
  <div class="rtable"><div style="display:grid;grid-template-columns:28px 36px 1fr auto auto;gap:10px;padding:10px 4px 6px" class="lbl"><span>#</span><span></span><span>${t("player")}</span><span>${t("balls")}</span><span>${t("pts").toUpperCase()}</span></div>${rest.map((x,i)=>rrow(i+4,x,false)).join("")}</div></div>
  <div class="pad" style="padding-top:12px"><div style="background:var(--red-t);border:1.5px solid var(--red);border-radius:16px;padding:10px 12px"><div class="lbl" style="color:var(--red);font-size:11px;margin-bottom:4px">${t("yourPos")}</div>${rrow(myPos,me,true)}</div></div>`;
}
/* ---- profile ---- */
function sProfile(){
  const P = S.profile; const rate = Math.round(P.wins/P.comps*1000)/10;
  const stile = (i,k,v) => `<div style="display:flex;align-items:center;gap:10px;padding:12px"><span class="ic" style="width:36px;height:36px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center">${ic(i,18,"var(--navy)",2)}</span><div><div style="font-size:11px;font-weight:700;color:var(--muted)">${k}</div><div class="num" style="font-size:20px;font-weight:800;color:var(--navy);line-height:1.1">${v}</div></div></div>`;
  const hist = (S.history.length ? S.history : [{name:"Weekend Challenge",res:"champ",size:8,league:"EPL"},{name:"Friends Cup",res:"runner",size:4,league:"LL"}]).slice(0,3);
  return topbar("menu","gear",false) + `<div class="pad" style="padding-top:14px"><div class="h1" style="font-size:30px">${t("profH")}</div></div>
  <div class="pad stack" style="padding-top:14px">
    <div class="card"><div class="row" style="gap:16px"><span style="width:76px;height:76px;border-radius:999px;background:var(--red-t);border:3px solid var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0">${ic("user",36,"var(--red)",1.8)}</span><div style="flex:1;min-width:0"><div style="font-family:var(--display);font-weight:700;font-size:24px;color:var(--navy)">${pname("Mubarak")}</div><div class="row" style="font-size:13px;font-weight:700;color:var(--muted);gap:6px;margin-top:2px">${ic("flag",14,"var(--muted)",2)}${S.lang==="ar"?"الكويت":"Kuwait"}</div><div style="font-size:12px;font-weight:700;color:var(--muted);margin-top:6px">${t("favLeague")} <b style="color:var(--ink)">${S.lang==="ar"?lg().nameAr:lg().name}</b></div></div></div><button class="btn outline" style="height:44px;margin-top:14px" data-act="toast" data-arg="editProfile">${t("editProfile")}${ic("edit",18,"var(--red)",2.2)}</button></div>
    <div class="g2"><div style="background:var(--gold-t);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px">${ball("gold",48)}<div><div style="font-size:12px;font-weight:700;color:var(--gold)">${t("goldBalls")}</div><div class="num" style="font-size:30px;font-weight:800;color:var(--navy);line-height:1">${P.gold}</div></div></div><div style="background:var(--silver-l);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px">${ball("silver",48)}<div><div style="font-size:12px;font-weight:700;color:var(--silver)">${t("silverBalls")}</div><div class="num" style="font-size:30px;font-weight:800;color:var(--navy);line-height:1">${P.silver}</div></div></div></div>
    <div class="card"><div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:12px;font-weight:700;color:var(--muted)">${t("rankPts")}</div><div class="num" style="font-size:40px;font-weight:800;color:var(--navy);line-height:1.05">${P.pts}</div></div><div style="display:flex;align-items:flex-end;gap:4px;height:44px">${[12,18,16,26,30,44].map((h,i)=>`<span style="width:10px;height:${h}px;border-radius:3px;background:${i===5?"var(--red)":"#D9DDE6"}"></span>`).join("")}</div></div></div>
    <div class="card" style="padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))">${stile("trophy",t("comps"),P.comps)}${stile("star",t("wins"),P.wins)}${stile("medal",t("finals"),P.finals)}${stile("chart",t("winRate"),rate+"%")}</div>
    <div class="g2"><div class="stat"><span class="ic">${ic("trophy",20,"var(--red)",2)}</span><div><div class="k">${t("bracketRank")}</div><div class="v num">#${rankData().findIndex(x=>x[0]==="Mubarak")+1}</div></div></div><div class="stat"><span class="ic">${ic("crown",20,"var(--red)",2)}</span><div><div class="k">${t("fantasyRank")}</div><div class="v num">#42</div></div></div></div>
    <div class="card" style="padding:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-family:var(--display);font-weight:700;font-size:18px;color:var(--navy)">${t("recent")}</span><button class="link" data-act="go" data-arg="bracket">${t("viewAll")}</button></div>${hist.map(h=>`<div class="row" style="gap:10px;padding:10px 0;border-bottom:1px solid var(--line)">${badge(LEAGUES[h.league],32)}<div style="flex:1"><div style="font-weight:800;font-size:14px">${h.name}</div><div style="font-size:12px;font-weight:700;color:${h.res==="champ"?"var(--gold)":"var(--muted)"}">${h.res==="champ"?t("champ"):t("runnerUp")}</div></div>${ball(h.size===8?"gold":"silver",28)}</div>`).join("")}</div>
    <div class="stack" style="gap:10px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--display);font-weight:700;font-size:18px;color:var(--navy)">${t("achievements")}</span><button class="link">${t("viewAll")}</button></div><div class="g3"><div class="ach"><span class="ic" style="background:var(--gold-t)">${ic("star",20,"var(--gold)",2)}</span>${t("firstWin")}</div><div class="ach ${P.gold>0?"":"locked"}"><span class="ic" style="background:var(--gold-t)">${ic("crown",20,"var(--gold)",2)}</span>${t("goldChamp")}</div><div class="ach"><span class="ic" style="background:var(--silver-l)">${ic("medal",20,"var(--silver)",2)}</span>${t("tenComps")}</div></div></div></div>`;
}
function sFantasy(){
  return topbar("menu","bell") + `<div class="pad" style="padding-top:14px"><div class="h1" style="font-size:28px">${t("fanH")}</div><div class="sub">${t("fanS")}</div></div>
  <div class="pad stack" style="padding-top:16px"><div class="g2"><button class="comp" data-act="toast" data-arg="fanSoon"><span class="ic" style="background:var(--red-t)">${ic("globe",24,"var(--red)",2)}</span><div><div class="n">${t("fanGlobal")}</div><div class="s">${t("globalS")}</div></div></button><button class="comp" data-act="toast" data-arg="fanSoon"><span class="ic" style="background:var(--soft)">${ic("lock",24,"var(--navy)",2)}</span><div><div class="n">${t("fanPrivate")}</div><div class="s">${t("privateS")}</div></div></button></div>
  <div class="card"><div style="font-weight:800;font-size:16px;margin-bottom:10px">${t("challenges")}</div>${["c1","c2","c3","c4","c5"].map((k,i)=>`<div class="row" style="gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px"><span class="qn" style="width:22px;height:22px;border-radius:999px;background:${i===4?"var(--gold)":"var(--navy)"};color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</span>${t(k)}</div>`).join("")}</div>
  <button class="btn" data-act="toast" data-arg="fanSoon">${t("play")}${ic("arrow",18,"#fff",2.2,"flip")}</button></div>`;
}
function sNews(){ const L = lg(); return topbar("back","bell",false) + `<div class="pad" style="padding-top:14px"><div class="h1" style="font-size:30px">${t("newsH")}</div><div class="sub">${t("sample")} · ${S.lang==="ar"?L.nameAr:L.name}</div></div><div class="pad stack" style="padding-top:16px">${L.news.map((n,i)=>newsCard(n,t("hoursAgo",{n:2+2*i}),i%2?"#0E2240":L.color)).join("")}</div>`; }

/* ================= ACTIONS ================= */
function newBracket(){ const r = rng(S.seed*17+S.size); const names = PLAYERS.slice().sort(()=>r()-0.5); const n = S.size; const ps = names.slice(0,n-1); ps.splice(2,0,"Mubarak"); const rounds=[]; let cnt=n/2; const first=[]; for(let i=0;i<cnt;i++) first.push({a:ps[2*i],b:ps[2*i+1],winner:null}); rounds.push(first); cnt/=2; while(cnt>=1){ const rd=[]; for(let i=0;i<cnt;i++) rd.push({a:null,b:null,winner:null}); rounds.push(rd); cnt/=2; } S.bracket={rounds,champion:null}; S.round=0; S.matchIdx=0; S.preds={}; S.saved={}; S.result=null; S.deadline=null; S.seed = (S.seed*7+3)%1000+1; }
const ACT = {
  go:(a)=>go(a), nav:(a)=>{ const map={home:"home",comp:S.bracket?"bracket":"public",fantasy:"fantasy",rankings:"rankings",profile:"profile"}; go(map[a]); },
  back:()=>{ const b={public:"home",private:"home",bracket:S.roomType==="private"?"private":"public",predict:"bracket",results:"bracket",news:"home",fantasy:"home"}; go(b[S.screen]||"home"); },
  lang:(a)=>{ S.lang=a; save(); render(); },
  pickLeague:(a)=>{ S.league=a; if (S.bracket && S.bracket.league!==a){ S.bracket=null; S.result=null; S.code=null; S.roomType=null; } go("home"); },
  size:(a)=>{ S.size=+a; save(); render(); },
  joinPublic:(a)=>{ const [name,joined,total]=a.split("|"); S.size=+total; S.roomType="public"; S.roomName=name; S.roomSeats=+total; newBracket(); S.bracket.league=S.league; toast(t("roomFilled")); setTimeout(()=>go("bracket"),700); },
  createPrivate:()=>{ const v=document.getElementById("cname").value.trim(); S.roomName = v || "Mubarak & Friends"; S.roomType="private"; S.code="8ERS"+String(Math.floor(Math.random()*90)+10); S.roomSeats=1; save(); render(); let n=1; const fill=setInterval(()=>{ n++; S.roomSeats=n; save(); if (S.screen==="private") render(); if (n>=S.size){ clearInterval(fill); newBracket(); S.bracket.league=S.league; S.roomSeats=S.size; save(); if (S.screen==="private"){ render(); toast(t("roomFilled")); } } }, 900); },
  copy:()=>{ const c=S.code; const done=()=>toast(t("copied"),"copy"); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c).then(done,done); else done(); },
  share:(a)=>toast(t("shared",{x:a}),"link"),
  goldLocked:()=>sheet(`<div class="grab"></div><div class="row" style="gap:12px;margin-bottom:10px">${ball("gold",44)}<div style="font-family:var(--display);font-weight:700;font-size:20px;color:var(--navy)">${t("goldLockedH")}</div></div><p style="margin:0 0 14px;color:var(--muted);font-weight:600;font-size:14px;line-height:1.5">${t("goldLockedP")}</p><div class="stack" style="gap:8px;margin-bottom:16px"><div class="row" style="gap:10px;font-weight:700;font-size:14px">${ic(S.profile.gold>=5?"check":"lock",18,S.profile.gold>=5?"var(--green)":"var(--muted)",2.4)}${t("req1")} <span class="fade">(${S.profile.gold}/5)</span></div><div class="row" style="gap:10px;font-weight:700;font-size:14px">${ic(S.profile.pts>=500?"check":"lock",18,S.profile.pts>=500?"var(--green)":"var(--muted)",2.4)}${t("req2")} <span class="fade">(${S.profile.pts}/500)</span></div></div><button class="btn navy" data-act="closeSheet">${t("got")}</button>`),
  closeSheet:()=>closeSheet(),
  menu:()=>sheet(`<div class="grab"></div><div class="menu"><button data-act="lang" data-arg="${S.lang==="en"?"ar":"en"}">${ic("globe",22,"var(--navy)",2)}${t("menuLang")}: <b>${S.lang==="en"?"العربية":"English"}</b></button><button data-act="about">${ic("info",22,"var(--navy)",2)}${t("menuAbout")}</button><button data-act="reset">${ic("refresh",22,"var(--red)",2)}${t("menuReset")}</button></div>`),
  about:()=>sheet(`<div class="grab"></div><div style="font-family:var(--display);font-weight:700;font-size:20px;color:var(--navy);margin-bottom:8px">8ers · ${t("menuAbout")}</div><p style="margin:0 0 16px;color:var(--muted);font-weight:600;font-size:14px;line-height:1.5">${t("aboutP",{m:PTS.main,e:PTS.extra,h:PTS.ht})}</p><button class="btn navy" data-act="closeSheet">${t("close")}</button>`),
  reset:()=>{ const lang=S.lang; S=DEFAULT(); S.lang=lang; save(); closeSheet(); go("welcome"); toast(t("resetDone"),"refresh"); },
  notif:()=>{ S.notifs=0; save(); sheet(`<div class="grab"></div><div style="font-family:var(--display);font-weight:700;font-size:20px;color:var(--navy);margin-bottom:10px">${t("notif")}</div><div class="stack" style="gap:8px;margin-bottom:16px">${["n1","n2","n3"].map(k=>`<div class="row" style="gap:10px;padding:10px 12px;background:var(--soft);border-radius:12px;font-weight:700;font-size:14px">${ic("bell",18,"var(--red)",2)}${t(k)}</div>`).join("")}</div><button class="btn navy" data-act="closeSheet">${t("close")}</button>`); render(); },
  match:(a)=>{ S.matchIdx=+a; save(); render(); },
  main:(a)=>{ predFor(S.matchIdx).main=+a; save(); render(); },
  q:(a)=>{ const [id,v]=a.split("|"); predFor(S.matchIdx).q[id]=v; save(); render(); },
  ht:(a)=>{ const [s,d]=a.split("|").map(Number); const p=predFor(S.matchIdx); p.ht[s]=Math.max(0,Math.min(9,p.ht[s]+d)); save(); render(); },
  saveMatch:()=>{ const p=predFor(S.matchIdx); if (!complete(p,lg().sport)){ toast(t("missing"),"info"); return; } S.saved[S.round+":"+S.matchIdx]=true; toast(t("saved",{n:S.matchIdx+1})); const fx=fixtures(); const nxt=fx.findIndex((_,k)=>!S.saved[S.round+":"+k]); if (nxt>=0) S.matchIdx=nxt; save(); render(); },
  submitAll:()=>{ toast(t("allSaved"),"clock"); setTimeout(()=>{ simulate(); go("results"); }, 900); },
  newComp:()=>{ S.bracket=null; S.result=null; S.code=null; S.roomType=null; go("public"); },
  toast:(a)=>toast(t(a),"info"), segno:()=>{}
};
// after a results screen the user continues into the next round: set up round state when leaving results
function advanceRoundIfNeeded(){ if (S.result && S.result.won && S.result.round===S.round && S.round < S.bracket.rounds.length-1){ S.round++; S.matchIdx=0; S.deadline=null; S.result=null; } }

document.getElementById("phone").addEventListener("click", e => {
  const stop = e.target.closest("[data-stop]"); const bg = e.target.closest(".sheetbg");
  const btn = e.target.closest("[data-act]"); if (!btn){ if (bg && !stop) closeSheet(); return; }
  if (btn.dataset.act==="closeSheet"){ closeSheet(); return; }
  if (bg && btn.closest(".sheetbg") === bg && !btn.closest("[data-stop]")) { closeSheet(); return; }
  const act = btn.dataset.act; const arg = btn.dataset.arg;
  if (["go","nav","back"].includes(act)) { if (S.screen==="results" && (arg==="predict" || arg==="bracket" || act==="nav" || act==="back")) advanceRoundIfNeeded(); }
  if (act==="lang") closeSheet();
  ACT[act] && ACT[act](arg);
});
render();
</script>
</body></html>
